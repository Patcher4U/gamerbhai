name: Render weekly Shorts
# Every Monday: render the next 7 Shorts from tools/shorts_bank.json (no AI) and keep them as a downloadable artifact.
on:
  schedule: [{ cron: "0 22 * * 0" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core && pip install -q pillow
      - run: python -I tools/render_short.py --next 7 --out queue
      - uses: actions/upload-artifact@v4
        with: { name: shorts-week, path: queue/, retention-days: 30 }
      - name: Remember what was rendered
        run: |
          git config user.name "gamerbhai-bot"; git config user.email "actions@users.noreply.github.com"
          git add tools/shorts_state.json && git commit -m "Auto: rendered weekly Shorts" && git push || true
